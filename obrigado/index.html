<!-- Meta Pixel (Starnex) -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '824532740340711');
fbq('track', 'PageView');

/* Lead = lead MQL (faturamento de R$ 50 mil ou mais). É este evento que a campanha otimiza.
   Dispara UMA vez por envio do formulário: a LP grava o aviso "sx_lead" ao enviar.
   Atualizar a página ou abrir o endereço direto não dispara de novo (só o PageView). */
(function () {
  var KEY = 'sx_lead', lead = null, storage = true;
  try { lead = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (e) { storage = false; }
  /* sem acesso ao sessionStorage não dá para conferir: dispara para não perder o lead */
  if (storage && !(lead && lead.mql === true && !lead.fired)) return;
  var data = { content_name: 'Starnex Med' };
  if (lead && lead.esp) data.content_category = lead.esp;
  if (lead && lead.fat) data.faturamento = lead.fat;
  if (lead && lead.id) fbq('track', 'Lead', data, { eventID: lead.id }); else fbq('track', 'Lead', data);
  if (lead) { lead.fired = true; try { sessionStorage.setItem(KEY, JSON.stringify(lead)); } catch (e) {} }
})();
</script>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=824532740340711&ev=PageView&noscript=1" alt=""></noscript>
<!-- End Meta Pixel -->

<style>
  :root { --ink:#120b1f; --mute:#5b5370; --purple:#6d28d9; --tint:#f6f2ff; --line:#e4daf8; --ok:#15803d;
          --display:'Sora',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:radial-gradient(ellipse 640px 400px at 50% 42%, rgba(109,40,217,.14), rgba(109,40,217,0)) no-repeat, #fff; color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.6;
         -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; }
  h1, p { margin:0; }
  .top { padding:22px 24px; text-align:center; }
  .brand { display:inline-flex; align-items:center; gap:6px; font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:-.02em; }
  .brand-tag { background:var(--purple); color:#fff; border-radius:7px; padding:1px 8px 2px; font-size:14px; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:24px 24px 88px; }
  .card { width:100%; max-width:560px; text-align:center; background:#fff; border:1px solid var(--line);
          border-radius:28px; padding:48px 32px 44px; box-shadow:0 30px 60px -36px rgba(109,40,217,.45); }
  .ico { width:64px; height:64px; margin:0 auto 22px; border-radius:50%; background:#dcfce7; color:var(--ok); display:flex; align-items:center; justify-content:center; }
  .ico svg { width:32px; height:32px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
  h1 { font-family:var(--display); font-weight:700; font-size:clamp(26px,5vw,34px); line-height:1.15; letter-spacing:-.02em; text-wrap:balance; }
  .card p { margin:16px auto 0; max-width:40ch; color:var(--mute); }
  @media (max-width:520px) { .card { padding:38px 22px 34px; border-radius:24px; } main { padding-bottom:56px; } }
</style></head>
<body>
<header class="top"><div class="brand" aria-label="Starnex Med"><span>Starnex</span><span class="brand-tag">Med</span></div></header>
<main>
  <section class="card" aria-labelledby="t">
    <div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h1 id="t">Obrigado! Recebemos suas informações.</h1>
    <p>Nossa equipe entrará em contato com você em breve pelo WhatsApp.</p>
  </section>
</main>
</body>
